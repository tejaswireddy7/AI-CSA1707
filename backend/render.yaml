services:
  - type: web
    name: road-damage-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_PATH
        value: models/best.pt
      - key: CONFIDENCE_THRESHOLD
        value: "0.25"
      - key: IOU_THRESHOLD
        value: "0.45"
      - key: DEVICE
        value: cpu
      - key: MAX_FILE_SIZE_MB
        value: "20"
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,https://road-damage-ai.vercel.app"
    plan: free
